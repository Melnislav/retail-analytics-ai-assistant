[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "retail-assistant"
version = "1.0.0"
description = "Production-ready Hexagonal Retail Data Analysis Chat Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=1.3.0",
    "langchain-core>=1.3.0",
    "langgraph>=1.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.3.0",
    "google-cloud-bigquery>=3.27.0",
    "db-dtypes>=1.3.0",
    "pandas>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "langfuse>=2.57.0",
    "sqlglot>=28.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line-length violations (handled by ruff format)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Security",
    "fastapi.Body",
    "Depends",
    "Query",
    "Header",
    "Path",
    "Security",
    "Body",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["app", "main.py", "config.py", "container.py", "tests"]
exclude = ["^\\.venv/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
ignore_missing_imports = true
# plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
