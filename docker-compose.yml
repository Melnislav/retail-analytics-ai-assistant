services:
  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-retail_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - retail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail_assistant} -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: retail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - retail_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail_secret_pass}@postgres:5432/${POSTGRES_DB:-retail_assistant}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${API_PORT:-8000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail-cli
    profiles:
      - cli
    env_file:
      - .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:${API_PORT:-8000}}
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["python", "-m", "app.adapters.inbound.cli_client"]

volumes:
  retail_pgdata:
  retail_redisdata:
